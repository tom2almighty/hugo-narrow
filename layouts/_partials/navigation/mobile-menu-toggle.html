<!-- 移动端菜单按钮，打开原生 modal dialog -->
<button
  id="mobile-nav-open"
  type="button"
  class="border-border bg-background text-muted-foreground hover:bg-accent hover:text-foreground focus:ring-primary/20 flex h-10 w-10 items-center justify-center rounded-lg border transition-colors duration-200 focus:ring-2 focus:outline-none md:hidden"
  aria-label="{{ T `nav.menu` }}"
  aria-haspopup="dialog"
  aria-controls="mobile-nav"
>
  {{ partial "features/icon.html" (dict "name" "menu" "size" "md" "ariaLabel" "") }}
</button>
