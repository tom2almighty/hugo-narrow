{{- $logoSrc := strings.TrimPrefix "/" site.Params.header.logo.image -}}


<header class="{{- if site.Params.header.sticky -}}sticky top-0 z-40{{ end }} px-4 py-6">
  <div
    class="border-border bg-card/80 shadow-surface rounded-card flex items-center gap-3 border px-4 py-4 backdrop-blur-sm md:px-6"
  >
    {{ if ne site.Params.header.logo.image "" }}
      <a
        href="{{ if and site.Params.header.logo.link (ne site.Params.header.logo.link `/`) }}
          {{ site.Params.header.logo.link | relLangURL }}
        {{ else }}
          {{ site.Home.RelPermalink | relLangURL }}
        {{ end }}"
        class="flex h-10 w-10 shrink-0 items-center justify-center overflow-hidden rounded-full transition-transform duration-200 hover:scale-105"
        aria-label="{{ site.Title }}"
      >
        <img
          src="{{ $logoSrc | relURL }}"
          alt="{{ site.Title }}"
          class="h-full w-full object-cover"
        />
      </a>
    {{ else }}
      <a
        href="{{ site.Home.RelPermalink }}"
        class="bg-primary text-primary-foreground flex h-10 w-10 shrink-0 items-center justify-center rounded-full text-lg font-bold transition-transform duration-200 hover:scale-105"
        aria-label="{{ site.Title }}"
      >
        {{ substr site.Title 0 1 | upper }}
      </a>
    {{ end }}


    <a
      href="{{ site.Home.RelPermalink }}"
      class="text-foreground hover:text-primary min-w-0 truncate text-lg font-bold transition-colors"
    >
      {{ site.Title }}
    </a>
  </div>
</header>
