<dialog id="mobile-nav" class="mobile-nav-dialog" aria-labelledby="mobile-nav-title">
  <div class="bg-card text-foreground flex max-h-[85dvh] flex-col overflow-hidden">
    <div class="border-border flex items-center justify-between border-b px-4 py-4">
      <h2 id="mobile-nav-title" class="text-foreground text-lg font-semibold">
        {{ T "nav.menu" }}
      </h2>
      <button
        id="mobile-nav-close"
        type="button"
        class="text-muted-foreground hover:text-foreground hover:bg-accent focus:ring-primary/20 flex h-10 w-10 items-center justify-center rounded-lg transition-colors focus:ring-2 focus:outline-none"
        aria-label="{{ T `ui.closeMenu` }}"
      >
        {{ partial "features/icon.html" (dict "name" "close" "size" "md" "ariaLabel" "") }}
      </button>
    </div>

    <div class="flex-1 overflow-y-auto" data-mobile-menu>
      {{ partial "navigation/mobile-menu.html" . }}
    </div>
  </div>
</dialog>
