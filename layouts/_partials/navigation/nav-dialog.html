<dialog id="nav-dialog" class="nav-dialog" aria-labelledby="nav-dialog-title">
  <div class="bg-card text-foreground flex max-h-[85dvh] flex-col overflow-hidden">
    <div class="border-border flex items-center justify-between border-b px-4 py-4">
      <h2 id="nav-dialog-title" class="text-foreground text-lg font-semibold">
        {{ T "nav.menu" }}
      </h2>
      <button
        id="nav-dialog-close"
        type="button"
        class="text-muted-foreground hover:text-foreground hover:bg-accent focus-visible:ring-primary/40 flex h-10 w-10 items-center justify-center rounded-full transition-colors focus-visible:ring-2 focus-visible:outline-none"
        aria-label="{{ T `ui.closeMenu` }}"
      >
        {{ partial "features/icon.html" (dict "name" "close" "size" "md" "ariaLabel" "") }}
      </button>
    </div>

    <div class="flex-1 overflow-y-auto" data-nav-menu>
      {{ partial "navigation/nav-menu.html" . }}
    </div>
  </div>
</dialog>
