{{- $id := (site.Params.analytics.google | default dict).id -}}
{{- with $id }}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ . }}"></script>
  <script data-pjax>
    window.dataLayer = window.dataLayer || [];

    function gtag() {
      dataLayer.push(arguments);
    }

    gtag('js', new Date());

    gtag('config', '{{ . }}');
  </script>
{{- else }}
  {{- warnidf "analytics-google" "analytics.google.id is required when analytics.provider is google" -}}
{{- end }}
