name: Deploy Demo & Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "README.zh-Hans.md"
      - "AGENTS.md"
      - "LICENSE"
      - ".gitignore"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  # Keep the Hugo version in this branch's workflow so v1 and v2 can build independently.
  HUGO_VERSION: "0.168.0"

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Build site
        run: |
          hugo \
            --source=exampleSite \
            --themesDir=../.. \
            --minify \
            --destination=dist \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Checkout v1 theme
        uses: actions/checkout@v7
        with:
          ref: v1
          path: v1-build/hugo-narrow

      - name: Build v1 demo
        run: |
          hugo \
            --source=v1-build/hugo-narrow/exampleSite \
            --themesDir=../.. \
            --minify \
            --destination="$GITHUB_WORKSPACE/exampleSite/dist/v1" \
            --baseURL "${{ steps.pages.outputs.base_url }}/v1/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./exampleSite/dist

  deploy:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES_FILE=".github/release-notes/${GITHUB_REF_NAME}.md"
          TITLE="Hugo Narrow ${GITHUB_REF_NAME}"

          # Deleting a tag can leave the release behind as a draft, so an existing
          # release is always published here.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if [ -f "$NOTES_FILE" ]; then
              gh release edit "$GITHUB_REF_NAME" --title "$TITLE" --draft=false --notes-file "$NOTES_FILE"
            else
              gh release edit "$GITHUB_REF_NAME" --title "$TITLE" --draft=false
            fi
          elif [ -f "$NOTES_FILE" ]; then
            gh release create "$GITHUB_REF_NAME" --title "$TITLE" --notes-file "$NOTES_FILE"
          else
            gh release create "$GITHUB_REF_NAME" --title "$TITLE" --generate-notes
          fi
