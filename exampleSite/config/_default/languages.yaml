en:
  locale: en
  label: "English"
  weight: 1
  # 可选：按语言覆盖站点级 params.yaml 中的 dateFormat
  # params:
  #   dateFormat:
  #     long: "January 2, 2006"
  #     medium: "Jan 2, 2006"
  #     short: "01/02"

zh-hans:
  locale: zh-Hans
  label: "简体中文"
  weight: 2
  # Hugo 没有“年月”token，归档页的月份标题需要按语言覆盖。
  params:
    dateFormat:
      month: "2006年1月"

